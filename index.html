<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSync - Game Dev Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .tab-active { border-bottom: 2px solid #6366f1; color: #818cf8; }
        [color-scheme="dark"] { color-scheme: dark; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="layout"></i>
                </div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                    DevSync
                </h1>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                <input type="text" id="devNameInput" placeholder="Nama Dev Kamu" 
                       class="bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-48 transition-all">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <!-- Tabs -->
        <div class="flex space-x-2 border-b border-slate-800 mb-8">
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors tab-active">
                <i data-lucide="calendar" class="w-4 h-4"></i> Kalender Tim
            </button>
            <button onclick="switchTab('notes')" id="tab-notes" class="flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors text-slate-400 border-transparent">
                <i data-lucide="sticky-note" class="w-4 h-4"></i> Catatan Game
            </button>
        </div>

        <div id="section-calendar" class="space-y-8">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold text-slate-100">Jadwal Per-Developer</h2>
                <button onclick="openModal('scheduleModal')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i> Tambah Jadwal
                </button>
            </div>
            <div id="calendarContainer" class="space-y-10">
                <div class="py-20 text-center text-slate-500 italic">Menghubungkan ke server cloud...</div>
            </div>
        </div>

        <div id="section-notes" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold text-slate-100">Ide & Progress Game</h2>
                <button onclick="openModal('noteModal')" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i> Buat Catatan
                </button>
            </div>
            <div id="notesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>
        </div>
    </main>

    <!-- Modal Form Tambah Jadwal -->
    <div id="scheduleModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center p-4 border-b border-slate-800">
                <h3 class="text-lg font-bold text-slate-100">Tambah Jadwal Baru</h3>
                <button onclick="closeModal('scheduleModal')"><i data-lucide="x" class="w-5 h-5 text-slate-400 hover:text-white"></i></button>
            </div>
            <form id="scheduleForm" class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Judul Agenda</label>
                    <input type="text" id="schTitle" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200" placeholder="Contoh: Buat Aset Karakter">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Hari</label>
                        <select id="schDay" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200">
                            <option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Kategori</label>
                        <select id="schType" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200">
                            <option>Coding</option>
                            <option>Art/UI</option>
                            <option>Meeting</option>
                            <option>Testing</option>
                            <option>Les</option>
                            <option>Personal</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Dari Jam</label>
                        <input type="time" id="schStartTime" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 [color-scheme:dark]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Sampai Jam</label>
                        <input type="time" id="schEndTime" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 [color-scheme:dark]">
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 py-2.5 rounded-lg font-bold hover:bg-indigo-700 transition-colors">Simpan Jadwal</button>
            </form>
        </div>
    </div>

    <!-- Modal Form Buat Catatan -->
    <div id="noteModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center p-4 border-b border-slate-800">
                <h3 class="text-lg font-bold text-slate-100">Buat Catatan Baru</h3>
                <button onclick="closeModal('noteModal')"><i data-lucide="x" class="w-5 h-5 text-slate-400 hover:text-white"></i></button>
            </div>
            <form id="noteForm" class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nama Game</label>
                    <input type="text" id="noteGame" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200" placeholder="Contoh: RPG Mobile 2D">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Catatan</label>
                    <textarea id="noteContent" required rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 resize-none" placeholder="Isi ide atau progress..."></textarea>
                </div>
                <button type="submit" class="w-full bg-purple-600 py-2.5 rounded-lg font-bold hover:bg-purple-700 transition-colors">Simpan Catatan</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- KONFIGURASI FIREBASE ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "", 
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'dev-planner-01';

        let currentUser = null;
        let devName = localStorage.getItem('devName') || 'Developer';
        const DAYS = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

        let allSchedules = [];
        let allNotes = [];

        // Fungsi inisialisasi autentikasi sebelum akses Firestore
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Autentikasi gagal:", error);
            }
        };

        window.onload = () => {
            lucide.createIcons();
            document.getElementById('devNameInput').value = devName;
            
            // Jalankan auth dulu
            initAuth();

            // Dengarkan perubahan status auth
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    // Hanya panggil sinkronisasi setelah user terautentikasi
                    setupSync(); 
                }
            });
        };

        document.getElementById('devNameInput').onchange = (e) => {
            devName = e.target.value;
            localStorage.setItem('devName', devName);
            renderCalendar(); 
        };

        function setupSync() {
            if (!currentUser) return;

            // Path Firestore harus spesifik agar tidak terkena permission error
            const scheduleCol = collection(db, 'artifacts', appId, 'public', 'data', 'schedules');
            const notesCol = collection(db, 'artifacts', appId, 'public', 'data', 'notes');

            // Gunakan onSnapshot dengan error callback agar terlihat jika gagal
            onSnapshot(scheduleCol, (snapshot) => {
                allSchedules = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderCalendar();
            }, (err) => {
                console.error("Firestore Permission Error (schedules):", err);
            });

            onSnapshot(notesCol, (snapshot) => {
                allNotes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderNotes();
            }, (err) => {
                console.error("Firestore Permission Error (notes):", err);
            });
        }

        function renderCalendar() {
            const container = document.getElementById('calendarContainer');
            if (!container) return;
            container.innerHTML = '';

            const devGroups = {};
            devGroups[devName] = DAYS.reduce((acc, d) => ({ ...acc, [d]: [] }), {});

            allSchedules.forEach(s => {
                const name = s.devName || 'Anonim';
                if (!devGroups[name]) {
                    devGroups[name] = DAYS.reduce((acc, d) => ({ ...acc, [d]: [] }), {});
                }
                devGroups[name][s.day].push(s);
            });

            Object.entries(devGroups).forEach(([name, week]) => {
                const devRow = document.createElement('div');
                devRow.className = "bg-slate-900/40 p-4 sm:p-6 rounded-2xl border border-slate-800/60 shadow-lg";
                
                const isMe = name === devName;
                devRow.innerHTML = `
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 bg-indigo-500/20 rounded-full border border-indigo-500/30 flex items-center justify-center">
                            <i data-lucide="user" class="w-5 h-5 text-indigo-400"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-100">${name} ${isMe ? '<span class="ml-2 text-[10px] bg-indigo-600 px-2 py-0.5 rounded-full uppercase tracking-wider">Kamu</span>' : ''}</h3>
                    </div>
                    <div class="flex overflow-x-auto pb-4 gap-4 snap-x lg:grid lg:grid-cols-7">
                        ${DAYS.map(day => `
                            <div class="min-w-[200px] lg:min-w-0 bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col h-full snap-center">
                                <div class="bg-slate-800/50 py-2 px-4 border-b border-slate-800">
                                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-tight">${day}</span>
                                </div>
                                <div class="p-2 space-y-2 min-h-[120px]">
                                    ${week[day].length === 0 ? '<p class="text-[10px] text-slate-600 text-center py-4 italic">Kosong</p>' : ''}
                                    ${week[day].sort((a,b) => a.startTime.localeCompare(b.startTime)).map(s => `
                                        <div class="bg-slate-800/80 rounded-lg p-2.5 border border-slate-700/50 group relative hover:border-indigo-500/50 transition-all">
                                            <div class="flex justify-between items-center mb-1">
                                                <span class="text-[10px] font-bold text-indigo-400">${s.startTime} - ${s.endTime}</span>
                                                ${(s.userId === currentUser?.uid) ? `<button onclick="window.deleteSch('${s.id}')" class="text-slate-500 hover:text-red-400"><i data-lucide="trash-2" class="w-3 h-3"></i></button>` : ''}
                                            </div>
                                            <p class="text-xs font-medium text-slate-200 leading-snug mb-1.5">${s.title}</p>
                                            <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-700/50 text-slate-400 uppercase font-bold tracking-wider">${s.type}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(devRow);
            });
            lucide.createIcons();
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            if (!grid) return;
            grid.innerHTML = '';

            allNotes.sort((a,b) => b.createdAt - a.createdAt).forEach(note => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col hover:border-purple-500/30 transition-all shadow-md";
                card.innerHTML = `
                    <div class="p-4 flex-grow">
                        <div class="flex justify-between items-start mb-3">
                            <h4 class="font-bold text-slate-100">${note.gameName}</h4>
                            ${(note.userId === currentUser?.uid) ? `<button onclick="window.deleteNote('${note.id}')" class="text-slate-500 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                        </div>
                        <p class="text-sm text-slate-400 whitespace-pre-wrap">${note.content}</p>
                    </div>
                    <div class="bg-slate-800/30 px-4 py-2 border-t border-slate-800 flex justify-between items-center">
                        <span class="text-[10px] font-medium text-slate-500 italic">Oleh: ${note.devName}</span>
                        <div class="flex gap-1">
                            <span class="text-[10px] px-2 py-0.5 rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/20 font-bold uppercase">Ide</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        document.getElementById('scheduleForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const data = {
                title: document.getElementById('schTitle').value,
                day: document.getElementById('schDay').value,
                type: document.getElementById('schType').value,
                startTime: document.getElementById('schStartTime').value,
                endTime: document.getElementById('schEndTime').value,
                devName,
                userId: currentUser.uid,
                createdAt: Date.now()
            };
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'schedules'), data);
            closeModal('scheduleModal');
            e.target.reset();
        };

        document.getElementById('noteForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const data = {
                gameName: document.getElementById('noteGame').value,
                content: document.getElementById('noteContent').value,
                devName,
                userId: currentUser.uid,
                createdAt: Date.now()
            };
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'notes'), data);
            closeModal('noteModal');
            e.target.reset();
        };

        window.deleteSch = async (id) => {
            if (!currentUser) return;
            if(confirm("Hapus jadwal ini?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id));
        };

        window.deleteNote = async (id) => {
            if (!currentUser) return;
            if(confirm("Hapus catatan ini?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'notes', id));
        };

        window.switchTab = (tab) => {
            document.getElementById('section-calendar').classList.toggle('hidden', tab !== 'calendar');
            document.getElementById('section-notes').classList.toggle('hidden', tab !== 'notes');
            document.getElementById('tab-calendar').className = `flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors ${tab === 'calendar' ? 'tab-active' : 'text-slate-400 border-transparent'}`;
            document.getElementById('tab-notes').className = `flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors ${tab === 'notes' ? 'tab-active' : 'text-slate-400 border-transparent'}`;
        };

        window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

    </script>
</body>
</html>
