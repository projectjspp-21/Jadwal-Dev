<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSync - Game Dev Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .tab-active { border-bottom: 2px solid #6366f1; color: #818cf8; }
        .project-card:hover { transform: translateY(-4px); border-color: rgba(139, 92, 246, 0.5); }
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="layout"></i>
                </div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                    DevSync
                </h1>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div id="connectionStatus" class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/50 border border-slate-700">
                    <div class="w-2 h-2 rounded-full bg-amber-500 animate-pulse" id="statusDot"></div>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400" id="statusText">Connecting</span>
                </div>
                <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                <input type="text" id="devNameInput" placeholder="Nama Dev Kamu" 
                       class="bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-48 transition-all">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <!-- Tabs -->
        <div class="flex space-x-2 border-b border-slate-800 mb-8">
            <button onclick="switchTab('calendar')" id="tab-calendar" class="flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors tab-active">
                <i data-lucide="calendar" class="w-4 h-4"></i> Kalender Tim
            </button>
            <button onclick="switchTab('projects')" id="tab-projects" class="flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors text-slate-400 border-transparent">
                <i data-lucide="folder-kanban" class="w-4 h-4"></i> Proyek Game
            </button>
        </div>

        <!-- Section Kalender -->
        <div id="section-calendar" class="space-y-8">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold text-slate-100">Jadwal Per-Developer</h2>
                <button onclick="openModal('scheduleModal')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i> Tambah Jadwal
                </button>
            </div>
            <div id="calendarContainer" class="grid grid-cols-1 gap-8">
                <div class="flex flex-col items-center justify-center py-20 text-slate-500" id="calInitialLoader">
                    <i data-lucide="loader-2" class="w-8 h-8 loading-spin mb-2"></i>
                    <p class="italic">Menunggu sinkronisasi cloud...</p>
                </div>
            </div>
        </div>

        <!-- Section Proyek -->
        <div id="section-projects" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold text-slate-100">Daftar Game</h2>
                <button onclick="openModal('projectCreateModal')" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i> Buat Game Baru
                </button>
            </div>
            <div id="projectsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Project cards render here -->
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="scheduleModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center p-4 border-b border-slate-800">
                <h3 class="text-lg font-bold text-slate-100">Tambah Jadwal Baru</h3>
                <button onclick="closeModal('scheduleModal')"><i data-lucide="x" class="w-5 h-5 text-slate-400 hover:text-white"></i></button>
            </div>
            <form id="scheduleForm" class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Judul Agenda</label>
                    <input type="text" id="schTitle" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Hari</label>
                        <select id="schDay" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200">
                            <option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option><option>Sabtu</option><option>Minggu</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Kategori</label>
                        <select id="schType" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200">
                            <option>Coding</option><option>Art/UI</option><option>Meeting</option><option>Testing</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Mulai</label>
                        <input type="time" id="schStartTime" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 [color-scheme:dark]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Selesai</label>
                        <input type="time" id="schEndTime" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 [color-scheme:dark]">
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 py-2.5 rounded-lg font-bold hover:bg-indigo-700 transition-colors">Simpan Jadwal</button>
            </form>
        </div>
    </div>

    <div id="projectCreateModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center p-4 border-b border-slate-800">
                <h3 class="text-lg font-bold text-slate-100">Daftarkan Proyek Game</h3>
                <button onclick="closeModal('projectCreateModal')"><i data-lucide="x" class="w-5 h-5 text-slate-400 hover:text-white"></i></button>
            </div>
            <form id="projectCreateForm" class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nama Game</label>
                    <input type="text" id="projName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200" placeholder="Contoh: Project Cyberpunk">
                </div>
                <button type="submit" class="w-full bg-purple-600 py-2.5 rounded-lg font-bold hover:bg-purple-700 transition-colors">Buat Proyek</button>
            </form>
        </div>
    </div>

    <div id="projectDetailModal" class="fixed inset-0 bg-slate-950 z-50 hidden flex flex-col">
        <div class="border-b border-slate-800 bg-slate-900 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="closeModal('projectDetailModal')" class="p-2 hover:bg-slate-800 rounded-lg transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6 text-slate-400"></i>
                </button>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-purple-600/20 rounded-lg flex items-center justify-center">
                        <i data-lucide="gamepad-2" class="text-purple-500"></i>
                    </div>
                    <div>
                        <h2 id="currentProjectTitle" class="text-xl font-bold text-white">Nama Game</h2>
                        <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Project Dashboard</p>
                    </div>
                </div>
            </div>
            <button onclick="openModal('addNoteModal')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> Tambah Catatan / Progress
            </button>
        </div>
        <div class="flex-grow overflow-y-auto p-6 bg-[radial-gradient(circle_at_top,rgba(30,41,59,0.5)_0%,rgba(15,23,42,1)_100%)]">
            <div id="projectNotesContainer" class="max-w-4xl mx-auto space-y-6">
                <!-- Sub-notes -->
            </div>
        </div>
    </div>

    <div id="addNoteModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center p-4 border-b border-slate-800">
                <h3 class="text-lg font-bold text-slate-100 italic uppercase tracking-tight">Tambah Update Progress</h3>
                <button onclick="closeModal('addNoteModal')"><i data-lucide="x" class="w-5 h-5 text-slate-400 hover:text-white"></i></button>
            </div>
            <form id="addNoteForm" class="p-4 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Judul Catatan</label>
                    <input type="text" id="noteSubject" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200" placeholder="Misal: Desain Level 1">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Isi Detail</label>
                    <textarea id="noteContent" required rows="6" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-slate-200 resize-none" placeholder="Jelaskan progress atau idemu..."></textarea>
                </div>
                <button type="submit" class="w-full bg-indigo-600 py-2.5 rounded-lg font-bold hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-900/20">Simpan Update</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app';

        let currentUser = null;
        let activeProjectId = null;
        let devName = localStorage.getItem('devName') || 'Developer';

        const updateStatus = (status) => {
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');
            if(status === 'connected') {
                dot.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]";
                txt.innerText = "Online";
                txt.className = "text-[10px] font-bold uppercase tracking-widest text-emerald-400";
            } else if(status === 'error') {
                dot.className = "w-2 h-2 rounded-full bg-red-500";
                txt.innerText = "Error";
                txt.className = "text-[10px] font-bold uppercase tracking-widest text-red-400";
            }
        };

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth failed", e);
                updateStatus('error');
            }
        };

        window.onload = () => {
            document.getElementById('devNameInput').value = devName;
            initAuth();
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    updateStatus('connected');
                    setupSync();
                }
            });
            lucide.createIcons();
        };

        function setupSync() {
            if (!currentUser) return;
            
            // Sync Schedules
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'schedules'), (snap) => {
                const data = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderCalendar(data);
            }, (err) => {
                console.error(err);
                updateStatus('error');
            });

            // Sync Projects
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), (snap) => {
                const data = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderProjects(data);
            });
        }

        function renderCalendar(data) {
            const container = document.getElementById('calendarContainer');
            if (!container) return;
            container.innerHTML = '';
            const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
            
            const devs = [...new Set(data.map(s => s.devName))];
            if (devs.length === 0 && data.length === 0) {
                container.innerHTML = `<div class="py-10 text-center text-slate-600 italic">Belum ada jadwal. Tambahkan jadwal pertamamu!</div>`;
                return;
            }

            // Ensure current dev exists in list even if no schedule yet
            if(!devs.includes(devName)) devs.push(devName);

            devs.sort().forEach(dName => {
                const devRow = document.createElement('div');
                devRow.className = "bg-slate-900/50 rounded-2xl border border-slate-800 p-6 mb-6";
                devRow.innerHTML = `
                    <div class="flex items-center gap-2 mb-4">
                        <div class="w-8 h-8 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400 font-bold text-xs">${dName[0]}</div>
                        <h3 class="font-bold text-slate-200">${dName}</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-7 gap-3">
                        ${days.map(day => {
                            const items = data.filter(s => s.devName === dName && s.day === day);
                            return `
                                <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 min-h-[80px]">
                                    <p class="text-[9px] font-bold text-slate-500 uppercase mb-2">${day}</p>
                                    ${items.map(i => `
                                        <div class="bg-slate-800 p-2 rounded-lg text-[10px] border-l-2 border-indigo-500 mb-1 group relative">
                                            <div class="font-bold text-slate-300">${i.title}</div>
                                            <div class="text-slate-500">${i.startTime} - ${i.endTime}</div>
                                            ${i.userId === currentUser.uid ? `<button onclick="window.deleteSch('${i.id}')" class="absolute top-1 right-1 opacity-0 group-hover:opacity-100 text-red-500"><i data-lucide="x" class="w-3 h-3"></i></button>` : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(devRow);
            });
            lucide.createIcons();
        }

        function renderProjects(data) {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';
            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-10 text-center text-slate-600 italic">Belum ada proyek game. Klik tombol "Buat Game Baru".</div>`;
            }
            data.forEach(p => {
                const card = document.createElement('div');
                card.className = "project-card bg-slate-900 border border-slate-800 rounded-2xl p-8 flex flex-col items-center justify-center text-center cursor-pointer transition-all group relative";
                card.innerHTML = `
                    <div class="w-20 h-20 bg-purple-500/10 rounded-3xl flex items-center justify-center mb-4 group-hover:bg-purple-500/20 transition-all">
                        <i data-lucide="gamepad-2" class="text-purple-500 w-10 h-10"></i>
                    </div>
                    <h4 class="text-xl font-bold text-white uppercase tracking-tight">${p.name}</h4>
                    <p class="text-[10px] text-slate-500 mt-2 font-bold tracking-widest">BUKA DASHBOARD</p>
                    <button onclick="event.stopPropagation(); window.deleteProject('${p.id}')" class="absolute top-4 right-4 p-2 text-slate-700 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                `;
                card.onclick = () => window.openProject(p);
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        window.openProject = (p) => {
            activeProjectId = p.id;
            document.getElementById('currentProjectTitle').innerText = p.name;
            openModal('projectDetailModal');
            syncNotes();
        };

        function syncNotes() {
            if (!activeProjectId) return;
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'project_notes'), (snap) => {
                const notes = snap.docs
                    .map(d => ({id: d.id, ...d.data()}))
                    .filter(n => n.projectId === activeProjectId)
                    .sort((a,b) => b.createdAt - a.createdAt);
                renderNotes(notes);
            });
        }

        function renderNotes(notes) {
            const container = document.getElementById('projectNotesContainer');
            container.innerHTML = notes.length === 0 ? `<div class="text-center py-20 text-slate-700 italic">Belum ada catatan untuk proyek ini.</div>` : '';
            notes.forEach(n => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h5 class="text-lg font-bold text-indigo-400">${n.subject}</h5>
                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Oleh: ${n.devName} • ${new Date(n.createdAt).toLocaleString()}</p>
                        </div>
                        ${n.userId === currentUser.uid ? `<button onclick="window.deleteNote('${n.id}')" class="text-slate-700 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                    </div>
                    <div class="text-slate-300 leading-relaxed whitespace-pre-wrap">${n.content}</div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        // --- Actions ---
        document.getElementById('projectCreateForm').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('projName').value;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), { name, createdAt: Date.now(), userId: currentUser.uid });
                closeModal('projectCreateModal');
                e.target.reset();
            } catch(err) { console.error(err); }
        };

        document.getElementById('addNoteForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!activeProjectId) return;
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'project_notes'), {
                    projectId: activeProjectId,
                    subject: document.getElementById('noteSubject').value,
                    content: document.getElementById('noteContent').value,
                    devName, userId: currentUser.uid, createdAt: Date.now()
                });
                closeModal('addNoteModal');
                e.target.reset();
            } catch(err) { console.error(err); }
        };

        document.getElementById('scheduleForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'schedules'), {
                    title: document.getElementById('schTitle').value,
                    day: document.getElementById('schDay').value,
                    type: document.getElementById('schType').value,
                    startTime: document.getElementById('schStartTime').value,
                    endTime: document.getElementById('schEndTime').value,
                    devName, userId: currentUser.uid, createdAt: Date.now()
                });
                closeModal('scheduleModal');
                e.target.reset();
            } catch(err) { console.error(err); }
        };

        window.deleteProject = async (id) => { if(confirm("Hapus proyek ini?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', id)); };
        window.deleteSch = async (id) => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id)); };
        window.deleteNote = async (id) => { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'project_notes', id)); };

        window.switchTab = (t) => {
            document.getElementById('section-calendar').classList.toggle('hidden', t !== 'calendar');
            document.getElementById('section-projects').classList.toggle('hidden', t !== 'projects');
            document.getElementById('tab-calendar').className = `flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors ${t === 'calendar' ? 'tab-active' : 'text-slate-400 border-transparent'}`;
            document.getElementById('tab-projects').className = `flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors ${t === 'projects' ? 'tab-active' : 'text-slate-400 border-transparent'}`;
        };

        window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        document.getElementById('devNameInput').onchange = (e) => {
            devName = e.target.value;
            localStorage.setItem('devName', devName);
        };
    </script>
</body>
</html>
